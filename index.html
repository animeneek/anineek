<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>AniNeek v23.42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/8e3f3e5f4e.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Include Header -->
    <div id="header"></div>

    <!-- Include Filter Menu -->
    <div id="filter-menu-container"></div>

    <!-- Slider Container -->
    <div id="sliderContainer" class="slider-container">
        <div id="slider" class="slider"></div>
        <div class="slider-navigation">
            <button id="prevSlide" class="slider-nav-button">&#10094;</button>
            <button id="nextSlide" class="slider-nav-button">&#10095;</button>
        </div>
        <div id="sliderDots" class="slider-dots"></div>
    </div>

    <!-- Box Container with Tab Headings and Anime List -->
    <div id="animeTabsContainer" class="anime-tabs-container">
        <div class="tab-headings">
            <button class="tab-button active" data-tab="newest">Newest</button>
            <button class="tab-button" data-tab="popular">Popular</button>
            <button class="tab-button" data-tab="top-rated">Top Rated</button>
            <div class="pagination">
                <button id="prevPage" class="pagination-button"> &lt; </button>
                <span id="currentPage" class="pagination-current">1</span>
                <button id="nextPage" class="pagination-button"> &gt; </button>
            </div>
        </div>
        <div id="animeList" class="anime-list"></div>
    </div>

    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
                // Initialize search and random functionality after loading the header
                initializeSearchAndRandom();
            });

        // Load the filter menu HTML and inject it into the container
        fetch('filter-menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('filter-menu-container').innerHTML = html;
                console.log('Filter menu loaded successfully.');
                // Initialize genre fetching after loading the filter menu
                fetchGenres();
            })
            .catch(error => console.error('Error loading filter menu:', error));

        // Fetch genres function
        async function fetchGenres() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/genres/anime');
                const data = await response.json();
                const genres = data.data.sort((a, b) => a.name.localeCompare(b.name));
                const genreDropdown = document.getElementById('genreDropdown');

                genres.forEach(genre => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" value="${genre.mal_id}" onchange="searchAnime()"/> ${genre.name}`;
                    genreDropdown.appendChild(label);
                });
                console.log('Genres fetched and displayed successfully.');
            } catch (error) {
                console.error("Error fetching genres:", error);
            }
        }

        // Other functions

        function getSelectedGenres() {
            const selectedGenres = [];
            document.querySelectorAll('#genreDropdown input[type="checkbox"]:checked').forEach(checkbox => {
                selectedGenres.push(checkbox.value);
            });
            return selectedGenres;
        }

        function clearFilters() {
            document.querySelectorAll('#genreDropdown input[type="checkbox"]:checked').forEach(checkbox => checkbox.checked = false);
            searchAnime();
        }

        async function searchAnime() {
            const query = ''; // Replace with actual search query
            const selectedGenres = getSelectedGenres();
            const url = `https://api.jikan.moe/v4/anime?q=${query}&genres=${selectedGenres.join(',')}&limit=25&page=1`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                displaySearchResults(data);
            } catch (error) {
                console.error("Error fetching anime:", error);
            }
        }

        function displaySearchResults(data) {
            const animeList = document.getElementById('animeList');
            animeList.innerHTML = ''; // Clear previous results

            data.data.forEach(anime => {
                const animeItem = document.createElement('div');
                animeItem.className = 'anime-item';

                animeItem.innerHTML = `
                    <div class="poster-container">
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}" class="anime-poster">
                        <div class="overlay">
                            <div class="play-button"><i class="fas fa-play"></i></div>
                        </div>
                    </div>
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-details">
                        <div class="detail-box">${anime.type}</div>
                        <div class="detail-box">${anime.episodes} Episodes</div>
                        <div class="detail-box">${anime.score} Rating</div>
                        <div class="detail-box">${anime.start_date ? new Date(anime.start_date).getFullYear() : 'N/A'}</div>
                    </div>
                `;

                animeList.appendChild(animeItem);
            });
        }
    </script>

    <script src="index.js"></script>
    <script src="slider.js"></script>
    <script src="tabs.js"></script>
    <script src="anilist-image-replacer.js"></script>

</body>
</html>
