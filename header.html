<header>
    <img src="/anineek/public/AniNeek_Logo.png" id="logo" alt="AniNeek">

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search anime...">
        <button id="searchButton">
            <i class="fa-solid fa-magnifying-glass icon"></i>
        </button>
    </div>

    <!-- Random Button (Placed immediately after search box) -->
    <button id="randomButton">
        <i class="fa-solid fa-shuffle icon"></i>
    </button>

    <!-- Dropdown Filters -->
    <div id="filters">
        <div class="dropdownContainer">
            <select id="genres" multiple>
                <option value="">Genres</option>
                <!-- Populate genres dynamically from API -->
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="themes" multiple>
                <option value="">Themes</option>
                <!-- Populate themes dynamically from API -->
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="demographics" multiple>
                <option value="">Demographics</option>
                <!-- Populate demographics dynamically from API -->
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="seasons" multiple>
                <option value="">Anime Seasons</option>
                <!-- Populate seasons dynamically from API -->
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="types" multiple>
                <option value="">Type</option>
                <!-- Populate types dynamically from API -->
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="status" multiple>
                <option value="">Status</option>
                <!-- Populate status dynamically from API -->
            </select>
        </div>
        <button id="clearFilters">Clear Filters</button>
    </div>
</header>
