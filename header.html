<header>
    <img src="/anineek/public/AniNeek_Logo.png" id="logo" alt="AniNeek">

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search anime...">
        <button id="searchButton">
            <i class="fa-solid fa-magnifying-glass icon"></i>
        </button>
    </div>

    <!-- Dropdowns -->
    <div class="filter-container">
        <select id="genreDropdown" multiple>
            <option value="">Select Genres</option>
        </select>
        <select id="themeDropdown" multiple>
            <option value="">Select Themes</option>
        </select>
        <select id="demographicDropdown" multiple>
            <option value="">Select Demographics</option>
        </select>
        <select id="seasonDropdown" multiple>
            <option value="">Select Seasons</option>
        </select>
        <select id="typeDropdown" multiple>
            <option value="">Select Types</option>
        </select>
        <select id="statusDropdown" multiple>
            <option value="">Select Status</option>
        </select>
        <button id="clearFiltersButton">Clear Filters</button>
    </div>

    <!-- Random Button (Placed immediately after search box) -->
    <button id="randomButton">
        <i class="fa-solid fa-shuffle icon"></i>
    </button>
</header>
