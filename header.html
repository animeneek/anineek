<header>
    <img src="/anineek/public/AniNeek_Logo.png" id="logo" alt="AniNeek">

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search anime...">
        <button id="searchButton">
            <i class="fa-solid fa-magnifying-glass icon"></i>
        </button>
    </div>

    <button id="randomButton">
        <i class="fa-solid fa-shuffle icon"></i>
    </button>

    <!-- Dropdown Filters -->
    <div id="filters" class="dropdowns">
        <div class="dropdownContainer">
            <select id="genres" multiple>
                <option value="">Select Genres</option>
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="themes" multiple>
                <option value="">Select Themes</option>
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="demographics" multiple>
                <option value="">Select Demographics</option>
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="seasons" multiple>
                <option value="">Select Seasons</option>
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="types" multiple>
                <option value="">Select Types</option>
            </select>
        </div>
        <div class="dropdownContainer">
            <select id="status" multiple>
                <option value="">Select Status</option>
            </select>
        </div>
        <button id="clearFilters">Clear Filters</button>
    </div>
</header>

<style>
    #filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
    }
    .dropdownContainer {
        flex: 1 1 150px; /* Responsive width */
    }
    select {
        width: 100%;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
</style>
