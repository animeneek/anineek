<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Menu</title>
    <style>
        .filter-menu {
            display: flex;
            flex-direction: column;
            margin: 10px 0;
            margin-top: 65px;
            padding: 20px;
            background: #222;
            border-radius: 10px;
            color: #fff;
        }
        .filter-menu h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .filter-menu label {
            margin-right: 10px;
            margin-bottom: 5px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .filter-menu input[type="checkbox"] {
            margin-right: 5px;
        }
        .filter-menu button {
            margin-top: 10px;
            padding: 10px;
            background: #ff4444;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        .filter-menu button:hover {
            background: #ff6666;
        }
    </style>
</head>
<body>
    <div class="filter-menu">
        <h2>Filter by Genre</h2>
        <div id="genreDropdown">
            <!-- Genres will be populated here -->
        </div>
        <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            fetchGenres();
        });

        async function fetchGenres() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/genres/anime');
                const data = await response.json();
                const genres = data.data.sort((a, b) => a.name.localeCompare(b.name));
                const genreDropdown = document.getElementById('genreDropdown');

                genres.forEach(genre => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" value="${genre.mal_id}"/> ${genre.name}`;
                    genreDropdown.appendChild(label);
                });
            } catch (error) {
                console.error("Error fetching genres:", error);
            }
        }

        function getSelectedGenres() {
            const selectedGenres = [];
            document.querySelectorAll('#genreDropdown input[type="checkbox"]:checked').forEach(checkbox => {
                selectedGenres.push(checkbox.value);
            });
            return selectedGenres;
        }

        function applyFilters() {
            const selectedGenres = getSelectedGenres();
            if (selectedGenres.length > 0) {
                const url = `search.html?genres=${selectedGenres.join(',')}`;
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
