<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Filter Menu</title>
    <style>
        /* Filter Menu Styling */
        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 80px; /* Adjust this value if needed */
            z-index: 999; /* Ensure it stays on top */
        }

        .filter-dropdown {
            position: relative;
            display: inline-block;
            margin: 5px;
        }

        .dropdown-button {
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 180px; /* Adjust width if needed */
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: #222;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 5px;
            overflow-y: auto;
            max-height: 200px; /* Adjust height if needed */
        }

        .dropdown-content label {
            color: #fff;
            padding: 10px;
            display: block;
        }

        .dropdown-content input {
            margin-right: 10px;
        }

        .filter-dropdown:hover .dropdown-content {
            display: block;
        }

        .clear-filters-button {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 5px;
        }

        .clear-filters-button:hover {
            background: #ff2222;
        }
    </style>
</head>

<script>
    function clearFilters() {
        const checkboxes = document.querySelectorAll('.filter-dropdown input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            checkbox.checked = false;
        });
    }
</script>
