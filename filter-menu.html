<div id="filterMenu" class="filter-menu" style="background-color: #222; padding: 10px; border: 1px solid black;">
    <select class="filter-dropdown" id="filter1"></select>
    <select class="filter-dropdown" id="filter2"></select>
    <select class="filter-dropdown" id="filter3"></select>
    <select class="filter-dropdown" id="filter4"></select>
    <select class="filter-dropdown" id="filter5"></select>
    <select class="filter-dropdown" id="filter6"></select>
    <button id="clearFilters" class="clear-filters-button">Clear Filters</button>
</div>

<script>
    async function fetchGenres() {
        try {
            const response = await fetch("https://api.jikan.moe/v4/genres/anime");
            const data = await response.json();
            return data.data; // This should be an array of genres
        } catch (error) {
            console.error("Failed to fetch genres:", error);
            return [];
        }
    }

    function populateDropdown(dropdown, genres) {
        dropdown.innerHTML = "";
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.text = "Select Genre";
        dropdown.appendChild(defaultOption);

        genres.forEach(genre => {
            const option = document.createElement("option");
            option.value = genre.mal_id;
            option.text = genre.name;
            dropdown.appendChild(option);
        });
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const genres = await fetchGenres();

        for (let i = 1; i <= 6; i++) {
            const dropdown = document.getElementById(`filter${i}`);
            if (dropdown) {
                populateDropdown(dropdown, genres);
            }
        }
    });
</script>
