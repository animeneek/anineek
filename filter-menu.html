<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Menu</title>
    <style>
        .filter-menu {
            display: flex;
            flex-direction: column;
            margin: 10px 0;
            margin-top: 65px;
            padding: 20px;
            background: #222;
            border-radius: 10px;
            color: #fff;
        }
        .filter-menu h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .filter-menu .dropdown {
            position: relative;
            margin-bottom: 10px;
        }
        .filter-menu .dropdown button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
        }
        .filter-menu .dropdown-content {
            display: none;
            position: absolute;
            background: #333;
            width: 100%;
            border: 1px solid #444;
            border-radius: 5px;
            z-index: 1;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
        }
        .filter-menu .dropdown.open .dropdown-content {
            display: block;
        }
        .filter-menu .dropdown-content label {
            display: block;
            padding: 5px;
            cursor: pointer;
        }
        .filter-menu .dropdown-content input {
            margin-right: 10px;
        }
        .filter-menu button {
            margin-top: 10px;
            padding: 10px;
            background: #ff4444;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        .filter-menu button:hover {
            background: #ff6666;
        }
            .dropdown-content {
        display: none;
        position: absolute;
        background-color: #fff;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
        z-index: 1;
    }

    .dropdown-content.open {
        display: block;
    }

    .dropdown-content label {
        display: block;
    }
    </style>
</head>
<body>
    <div class="filter-menu">
    <h2>Filter by Genre</h2>
    <div class="dropdown">
        <button class="dropdown-button">Select Genres</button>
        <div class="dropdown-content" id="genreDropdown">
            <!-- Genres will be populated here -->
        </div>
    </div>
    <button onclick="applyFilters()">Apply Filters</button>
</div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            fetchGenres();
        });

        async function fetchGenres() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/genres/anime');
                const data = await response.json();
                const genres = data.data.sort((a, b) => a.name.localeCompare(b.name));
                const genreDropdown = document.getElementById('genreDropdown');

                genres.forEach(genre => {
                    const label = document.createElement('label');
                    label.className = 'genre-label';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = genre.mal_id;
                    checkbox.id = `genre-${genre.mal_id}`;
                    checkbox.className = 'genre-checkbox';

                    const span = document.createElement('span');
                    span.textContent = genre.name;

                    label.appendChild(checkbox);
                    label.appendChild(span);
                    genreDropdown.appendChild(label);
                });
            } catch (error) {
                console.error("Error fetching genres:", error);
            }
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('genreDropdownContainer');
            dropdown.classList.toggle('open');
        }

        function applyFilters() {
            const selectedGenres = Array.from(document.querySelectorAll('.genre-checkbox:checked')).map(checkbox => checkbox.value);
            const searchParams = new URLSearchParams(window.location.search);
            const query = searchParams.get('q') || '';
            if (selectedGenres.length > 0) {
                // Ensure the genres are included in the URL
                const url = `search.html?q=${query}&genres=${selectedGenres.join(',')}`;
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
