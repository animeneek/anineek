<div id="filterMenu" class="filter-menu" style="background-color: #222; padding: 10px; border: 1px solid black;">
    <select class="filter-dropdown" id="filter1">
        <option value="">Select Genre</option>
    </select>
    <select class="filter-dropdown" id="filter2"></select>
    <select class="filter-dropdown" id="filter3"></select>
    <select class="filter-dropdown" id="filter4"></select>
    <select class="filter-dropdown" id="filter5"></select>
    <select class="filter-dropdown" id="filter6"></select>
    <button id="clearFilters" class="clear-filters-button">Clear Filters</button>
</div>

<script>
    async function fetchGenres() {
        try {
            const response = await fetch("https://api.jikan.moe/v4/genres/anime");
            const json = await response.json();
            if (json && json.data && Array.isArray(json.data)) {
                return json.data;
            } else {
                console.error("Unexpected API format:", json);
                return [];
            }
        } catch (err) {
            console.error("Error fetching genres from Jikan:", err);
            return [];
        }
    }

    function populateFilter1(genres) {
        const dropdown = document.getElementById("filter1");
        if (!dropdown) {
            console.error("filter1 dropdown not found.");
            return;
        }

        // Start from index 1 because index 0 is already "Select Genre"
        genres.forEach(genre => {
            const option = document.createElement("option");
            option.value = genre.mal_id;
            option.text = genre.name;
            dropdown.appendChild(option);
        });
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const genres = await fetchGenres();
        console.log("Fetched genres:", genres);
        populateFilter1(genres);
    });
</script>
