<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Menu</title>
    <style>
        /* Add your website's style here */
        .filter-menu {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .filter-menu h2 {
            margin-bottom: 10px;
        }
        .dropdown {
            margin-bottom: 10px;
        }
        .dropdown label {
            display: block;
            margin-bottom: 5px;
        }
        .dropdown select {
            width: 100%;
            padding: 5px;
        }
        .clear-filters {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="filter-menu">
        <h2>Filter Menu</h2>
        <div class="dropdown">
            <label for="genres">Genres</label>
            <select id="genres" multiple>
                <!-- Options will be populated from myanimelist -->
                <option value="action">Action</option>
                <option value="adventure">Adventure</option>
            </select>
        </div>
        <div class="dropdown">
            <label for="themes">Themes</label>
            <select id="themes" multiple>
                <!-- Options will be populated from myanimelist -->
                <option value="school">School</option>
                <option value="supernatural">Supernatural</option>
            </select>
        </div>
        <div class="dropdown">
            <label for="demographics">Demographics</label>
            <select id="demographics" multiple>
                <!-- Options will be populated from myanimelist -->
                <option value="shounen">Shounen</option>
                <option value="seinen">Seinen</option>
            </select>
        </div>
        <div class="dropdown">
            <label for="anime-seasons">Anime Seasons</label>
            <select id="anime-seasons" multiple>
                <!-- Options will be populated from myanimelist -->
                <option value="spring-2021">Spring 2021</option>
                <option value="summer-2021">Summer 2021</option>
            </select>
        </div>
        <div class="dropdown">
            <label for="type">Type</label>
            <select id="type" multiple>
                <!-- Options will be populated from myanimelist -->
                <option value="tv">TV</option>
                <option value="movie">Movie</option>
            </select>
        </div>
        <div class="dropdown">
            <label for="status">Status</label>
            <select id="status" multiple>
                <!-- Options will be populated from myanimelist -->
                <option value="airing">Airing</option>
                <option value="completed">Completed</option>
            </select>
        </div>
        <button class="clear-filters" onclick="clearFilters()">Clear Filters</button>
    </div>

    <script>
        // Function to clear all selected filters
        function clearFilters() {
            document.querySelectorAll('select').forEach(select => {
                select.selectedIndex = -1;
            });
        }
    </script>
</body>
</html>
