<div id="filterMenu" class="filter-menu" style="background-color: #222; padding: 10px; border: 1px solid black;">
    <select class="filter-dropdown" id="filter1">
        <option value="">Select Genre</option>
    </select>
    <select class="filter-dropdown" id="filter2"></select>
    <select class="filter-dropdown" id="filter3"></select>
    <select class="filter-dropdown" id="filter4"></select>
    <select class="filter-dropdown" id="filter5"></select>
    <select class="filter-dropdown" id="filter6"></select>
    <button id="clearFilters" class="clear-filters-button">Clear Filters</button>
</div>

<script>
    async function fetchGenres() {
        try {
            const res = await fetch("https://api.jikan.moe/v4/genres/anime", {
                headers: { 'Content-Type': 'application/json' }
            });

            if (!res.ok) {
                throw new Error(`HTTP error! Status: ${res.status}`);
            }

            const data = await res.json();
            if (data && data.data && Array.isArray(data.data)) {
                console.log("✅ Genres fetched:", data.data);
                return data.data;
            } else {
                console.error("❌ Unexpected response structure:", data);
                return [];
            }

        } catch (err) {
            console.error("❌ Fetch failed:", err);
            return [];
        }
    }

    function populateGenres(dropdown, genres) {
        if (!dropdown) {
            console.error("❌ Dropdown element not found.");
            return;
        }

        genres.forEach(genre => {
            const option = document.createElement("option");
            option.value = genre.mal_id;
            option.textContent = genre.name;
            dropdown.appendChild(option);
        });
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const dropdown = document.getElementById("filter1");

        // Add loading indicator
        dropdown.innerHTML = `<option value="">Loading genres...</option>`;

        const genres = await fetchGenres();

        // Clear and re-add default if genres were fetched
        dropdown.innerHTML = `<option value="">Select Genre</option>`;

        if (genres.length > 0) {
            populateGenres(dropdown, genres);
        } else {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No genres available";
            dropdown.appendChild(option);
        }
    });
</script>
