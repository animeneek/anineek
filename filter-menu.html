<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Filter Menu</title>
    <style>
        /* Filter Menu Styling */
        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 80px; /* Adjust this value if needed */
            z-index: 999; /* Ensure it stays on top */
        }

        .filter-dropdown {
            position: relative;
            display: inline-block;
            margin: 5px;
        }

        .dropdown-button {
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 180px; /* Adjust width if needed */
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: #222;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
            overflow-y: auto;
            max-height: 200px; /* Adjust height if needed */
        }

        .dropdown-content label {
            color: #fff;
            padding: 10px;
            display: block;
        }

        .dropdown-content input {
            margin-right: 10px;
        }

        .filter-dropdown:hover .dropdown-content {
            display: block;
        }

        .clear-filters-button {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 5px;
        }

        .clear-filters-button:hover {
            background: #ff2222;
        }
    </style>
</head>
<body>

<div class="filter-menu">
    <!-- Genres -->
    <div class="filter-dropdown">
        <button class="dropdown-button">Genres</button>
        <div class="dropdown-content" id="genres-dropdown"></div>
    </div>

    <!-- Themes -->
    <div class="filter-dropdown">
        <button class="dropdown-button">Themes</button>
        <div class="dropdown-content" id="themes-dropdown"></div>
    </div>

    <!-- Demographics -->
    <div class="filter-dropdown">
        <button class="dropdown-button">Demographics</button>
        <div class="dropdown-content" id="demographics-dropdown"></div>
    </div>

    <!-- Anime Seasons -->
    <div class="filter-dropdown">
        <button class="dropdown-button">Anime Seasons</button>
        <div class="dropdown-content" id="seasons-dropdown"></div>
    </div>

    <!-- Type -->
    <div class="filter-dropdown">
        <button class="dropdown-button">Type</button>
        <div class="dropdown-content" id="types-dropdown"></div>
    </div>

    <!-- Status -->
    <div class="filter-dropdown">
        <button class="dropdown-button">Status</button>
        <div class="dropdown-content" id="status-dropdown"></div>
    </div>

    <!-- Clear Filters Button -->
    <button class="clear-filters-button" onclick="clearFilters()">Clear Filters</button>
</div>

<script>
    const genres = [
        "Action", "Adventure", "Avant Garde", "Comedy", "Drama", "Fantasy", "Horror", "Mystery", "Romance", "Sci-Fi", "Slice of Life", "Sports", "Supernatural", "Ecchi", "Hentai", "Erotica"
    ];

    const themes = [
        "Anthropomorphic", "CGDCT", "Childcare", "Combat Sports", "Crossdressing", "Delinquents", "Detective", "Gag Humor", "Gore", "Harem", "High Stakes Game", "Historical", "Idols (Female)", "Idols (Male)", "Isekai", "Iyashikei", "Love Polygon", "Magical Sex Shift", "Mahou Shoujo", "Martial Arts", "Mecha", "Medical", "Military", "Music", "Mythology", "Organized Crime", "Otaku Culture", "Parody", "Performing Arts", "Pirates", "Psychological", "Racing", "Reincarnation", "Reverse Harem", "Romantic Subtext", "Samurai", "School", "Showbiz", "Space", "Strategy Game", "Super Power", "Survival", "Team Sports", "Time Travel", "Vampire", "Video Game", "Villainess", "Visual Arts", "Workplace"
    ];

    const demographics = [
        "Shounen", "Shoujo", "Seinen", "Josei", "Kodomo"
    ];

    const seasons = [
        "Winter", "Spring", "Summer", "Fall"
    ];

    const types = [
        "TV", "OVA", "ONA", "Movie", "Special", "Music"
    ];

    const status = [
        "Currently Airing", "Finished Airing", "Not yet aired"
    ];

    function populateDropdown(id, items) {
        const dropdown = document.getElementById(id);
        items.forEach(item => {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = item;
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(item));
            dropdown.appendChild(label);
        });
    }

    function clearFilters() {
        const checkboxes = document.querySelectorAll('.filter-dropdown input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            checkbox.checked = false;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        populateDropdown('genres-dropdown', genres);
        populateDropdown('themes-dropdown', themes);
        populateDropdown('demographics-dropdown', demographics);
        populateDropdown('seasons-dropdown', seasons);
        populateDropdown('types-dropdown', types);
        populateDropdown('status-dropdown', status);
    });
</script>

</body>
</html>
