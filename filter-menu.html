<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Menu</title>
    <style>
        .filter-menu {
            display: flex;
            flex-direction: column;
            margin: 10px 0;
            margin-top: 65px;
            padding: 20px;
            background: #222;
            border-radius: 10px;
            color: #fff;
        }
        .filter-menu h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .filter-menu select {
            margin-bottom: 10px;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            height: 150px; /* set a height to show more options */
        }
        .filter-menu button {
            margin-top: 10px;
            padding: 10px;
            background: #ff4444;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        .filter-menu button:hover {
            background: #ff6666;
        }
    </style>
</head>
<body>
    <div class="filter-menu">
        <h2>Filter by Genre</h2>
        <select id="genreDropdown" multiple>
            <!-- Genres will be populated here -->
        </select>
        <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            fetchGenres();
        });

        async function fetchGenres() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/genres/anime');
                const data = await response.json();
                const genres = data.data.sort((a, b) => a.name.localeCompare(b.name));
                const genreDropdown = document.getElementById('genreDropdown');

                genres.forEach(genre => {
                    const option = document.createElement('option');
                    option.value = genre.mal_id;
                    option.textContent = genre.name;
                    genreDropdown.appendChild(option);
                });
            } catch (error) {
                console.error("Error fetching genres:", error);
            }
        }

        function applyFilters() {
            const selectedGenres = Array.from(document.getElementById('genreDropdown').selectedOptions).map(option => option.value);
            const searchParams = new URLSearchParams(window.location.search);
            const query = searchParams.get('q') || '';
            if (selectedGenres.length > 0) {
                const url = `search.html?q=${query}&genres=${selectedGenres.join(',')}`;
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
