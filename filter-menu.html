<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Filter Menu</title>
    <style>
        /* Filter Menu Styling */

        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 80px; /* Adjust this value if needed */
            z-index: 999; /* Ensure it stays on top */
        }

        .filter-dropdown {
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px;
            max-width: 200px;
        }

        .clear-filters-button {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 5px;
        }

        .clear-filters-button:hover {
            background: #ff2222;
        }
    </style>
</head>
<body>

<div class="filter-menu">
    <!-- Genres -->
    <select class="filter-dropdown" multiple>
        <option disabled>Genres</option>
        <!-- These values should ideally be fetched from MyAnimeList API -->
        <option>Action</option>
        <option>Adventure</option>
        <option>Comedy</option>
        <option>Drama</option>
        <option>Fantasy</option>
        <option>Horror</option>
        <option>Romance</option>
    </select>

    <!-- Themes -->
    <select class="filter-dropdown" multiple>
        <option disabled>Themes</option>
        <!-- These values should ideally be fetched from MyAnimeList API -->
        <option>Anthropomorphic</option>
        <option>Combat Sports</option>
        <option>Detective</option>
        <option>Gore</option>
        <option>Harem</option>
        <option>Isekai</option>
        <option>Psychological</option>
    </select>

    <!-- Demographics -->
    <select class="filter-dropdown" multiple>
        <option disabled>Demographics</option>
        <option>Shounen</option>
        <option>Shoujo</option>
        <option>Seinen</option>
        <option>Josei</option>
        <option>Kodomo</option>
    </select>

    <!-- Anime Seasons -->
    <select class="filter-dropdown" multiple>
        <option disabled>Anime Seasons</option>
        <option>Winter</option>
        <option>Spring</option>
        <option>Summer</option>
        <option>Fall</option>
    </select>

    <!-- Type -->
    <select class="filter-dropdown" multiple>
        <option disabled>Type</option>
        <option>TV</option>
        <option>OVA</option>
        <option>ONA</option>
        <option>Movie</option>
        <option>Special</option>
        <option>Music</option>
    </select>

    <!-- Status -->
    <select class="filter-dropdown" multiple>
        <option disabled>Status</option>
        <option>Currently Airing</option>
        <option>Finished Airing</option>
        <option>Not yet aired</option>
    </select>

    <!-- Clear Filters Button -->
    <button class="clear-filters-button" onclick="clearFilters()">Clear Filters</button>
</div>

<script>
    // Fetching data from MyAnimeList (or an API) for genres, themes, demographics, etc. (example with static data)

    // Placeholder function for fetching data from an API (MyAnimeList or another source)
    function fetchFilterData() {
        // Sample data; ideally you'd fetch this from an API endpoint
        const genres = ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Horror", "Romance"];
        const themes = ["Anthropomorphic", "Combat Sports", "Detective", "Gore", "Harem", "Isekai", "Psychological"];
        const demographics = ["Shounen", "Shoujo", "Seinen", "Josei", "Kodomo"];
        const seasons = ["Winter", "Spring", "Summer", "Fall"];
        const types = ["TV", "OVA", "ONA", "Movie", "Special", "Music"];
        const statuses = ["Currently Airing", "Finished Airing", "Not yet aired"];

        // Populate the dropdowns with these values dynamically
        populateDropdown('genres', genres);
        populateDropdown('themes', themes);
        populateDropdown('demographics', demographics);
        populateDropdown('seasons', seasons);
        populateDropdown('types', types);
        populateDropdown('statuses', statuses);
    }

    function populateDropdown(id, values) {
        const dropdown = document.getElementById(id);
        values.forEach(value => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            dropdown.appendChild(option);
        });
    }

    function clearFilters() {
        const dropdowns = document.querySelectorAll('.filter-dropdown');
        dropdowns.forEach(dropdown => {
            dropdown.selectedIndex = -1;  // Clear selection for multi-select
        });
    }

    // Initialize filter data fetching
    fetchFilterData();
</script>

</body>
</html>
