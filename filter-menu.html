<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Filter Menu</title>
    <style>
        /* Filter Menu Styling */

        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 80px; /* Adjust this value if needed */
            z-index: 999; /* Ensure it stays on top */
        }

        .filter-dropdown {
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px;
            width: 180px; /* Adjust width if needed */
        }

        .clear-filters-button {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 5px;
        }

        .clear-filters-button:hover {
            background: #ff2222;
        }
    </style>

    <!-- Include Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>

<div class="filter-menu">
    <!-- Genres -->
    <select class="filter-dropdown" id="genres" multiple="multiple">
        <option disabled>Genres</option>
        <option>Action</option>
        <option>Adventure</option>
        <option>Avant Garde</option>
        <option>Comedy</option>
        <option>Drama</option>
        <option>Fantasy</option>
        <option>Horror</option>
        <option>Mystery</option>
        <option>Romance</option>
        <option>Sci-Fi</option>
        <option>Slice of Life</option>
        <option>Sports</option>
        <option>Supernatural</option>
        <!-- Explicit genres -->
        <option>Ecchi</option>
        <option>Hentai</option>
        <option>Erotica</option>
    </select>

    <!-- Themes -->
    <select class="filter-dropdown" id="themes" multiple="multiple">
        <option disabled>Themes</option>
        <option>Anthropomorphic</option>
        <option>CGDCT</option>
        <option>Childcare</option>
        <option>Combat Sports</option>
        <option>Crossdressing</option>
        <option>Delinquents</option>
        <option>Detective</option>
        <option>Gag Humor</option>
        <option>Gore</option>
        <option>Harem</option>
        <option>High Stakes Game</option>
        <option>Historical</option>
        <option>Idols (Female)</option>
        <option>Idols (Male)</option>
        <option>Isekai</option>
        <option>Iyashikei</option>
        <option>Love Polygon</option>
        <option>Magical Sex Shift</option>
        <option>Mahou Shoujo</option>
        <option>Martial Arts</option>
        <option>Mecha</option>
        <option>Medical</option>
        <option>Military</option>
        <option>Music</option>
        <option>Mythology</option>
        <option>Organized Crime</option>
        <option>Otaku Culture</option>
        <option>Parody</option>
        <option>Performing Arts</option>
        <option>Pirates</option>
        <option>Psychological</option>
        <option>Racing</option>
        <option>Reincarnation</option>
        <option>Reverse Harem</option>
        <option>Romantic Subtext</option>
        <option>Samurai</option>
        <option>School</option>
        <option>Showbiz</option>
        <option>Space</option>
        <option>Strategy Game</option>
        <option>Super Power</option>
        <option>Survival</option>
        <option>Team Sports</option>
        <option>Time Travel</option>
        <option>Vampire</option>
        <option>Video Game</option>
        <option>Villainess</option>
        <option>Visual Arts</option>
        <option>Workplace</option>
    </select>

    <!-- Demographics -->
    <select class="filter-dropdown" id="demographics" multiple="multiple">
        <option disabled>Demographics</option>
        <option>Shounen</option>
        <option>Shoujo</option>
        <option>Seinen</option>
        <option>Josei</option>
        <option>Kodomo</option>
    </select>

    <!-- Anime Seasons -->
    <select class="filter-dropdown" id="seasons" multiple="multiple">
        <option disabled>Anime Seasons</option>
        <option>Winter</option>
        <option>Spring</option>
        <option>Summer</option>
        <option>Fall</option>
    </select>

    <!-- Type -->
    <select class="filter-dropdown" id="types" multiple="multiple">
        <option disabled>Type</option>
        <option>TV</option>
        <option>OVA</option>
        <option>ONA</option>
        <option>Movie</option>
        <option>Special</option>
        <option>Music</option>
    </select>

    <!-- Status -->
    <select class="filter-dropdown" id="status" multiple="multiple">
        <option disabled>Status</option>
        <option>Currently Airing</option>
        <option>Finished Airing</option>
        <option>Not yet aired</option>
    </select>

    <!-- Clear Filters Button -->
    <button class="clear-filters-button" onclick="clearFilters()">Clear Filters</button>
</div>

<!-- Include jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Include Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    // Initialize Select2 for all filter dropdowns
    $(document).ready(function() {
        $('.filter-dropdown').select2({
            placeholder: "Select options",
            allowClear: true
        });
    });

    function clearFilters() {
        $('.filter-dropdown').val(null).trigger('change');
    }
</script>

</body>
</html>
