<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Filter Menu</title>
    <style>
        /* Filter Menu Styling */

        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 80px; /* Adjust this value if needed */
            z-index: 999; /* Ensure it stays on top */
        }

        .filter-dropdown {
            position: relative;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px;
            max-width: 200px;
            cursor: pointer;
        }

        .filter-dropdown select {
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }

        .clear-filters-button {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 5px;
        }

        .clear-filters-button:hover {
            background: #ff2222;
        }
    </style>
</head>
<body>

<div class="filter-menu">
    <!-- Genres -->
    <div class="filter-dropdown" id="genres">
        <span>Select Genres</span>
        <select id="genres-select">
            <option value="">Select Genre</option>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
        </select>
    </div>

    <!-- Themes -->
    <div class="filter-dropdown" id="themes">
        <span>Select Themes</span>
        <select id="themes-select">
            <option value="">Select Theme</option>
            <option value="Anthropomorphic">Anthropomorphic</option>
            <option value="Combat Sports">Combat Sports</option>
            <option value="Detective">Detective</option>
            <option value="Gore">Gore</option>
            <option value="Harem">Harem</option>
            <option value="Isekai">Isekai</option>
            <option value="Psychological">Psychological</option>
        </select>
    </div>

    <!-- Demographics -->
    <div class="filter-dropdown" id="demographics">
        <span>Select Demographics</span>
        <select id="demographics-select">
            <option value="">Select Demographic</option>
            <option value="Shounen">Shounen</option>
            <option value="Shoujo">Shoujo</option>
            <option value="Seinen">Seinen</option>
            <option value="Josei">Josei</option>
            <option value="Kodomo">Kodomo</option>
        </select>
    </div>

    <!-- Anime Seasons -->
    <div class="filter-dropdown" id="seasons">
        <span>Select Anime Seasons</span>
        <select id="seasons-select">
            <option value="">Select Season</option>
            <option value="Winter">Winter</option>
            <option value="Spring">Spring</option>
            <option value="Summer">Summer</option>
            <option value="Fall">Fall</option>
        </select>
    </div>

    <!-- Type -->
    <div class="filter-dropdown" id="types">
        <span>Select Type</span>
        <select id="types-select">
            <option value="">Select Type</option>
            <option value="TV">TV</option>
            <option value="OVA">OVA</option>
            <option value="ONA">ONA</option>
            <option value="Movie">Movie</option>
            <option value="Special">Special</option>
            <option value="Music">Music</option>
        </select>
    </div>

    <!-- Status -->
    <div class="filter-dropdown" id="status">
        <span>Select Status</span>
        <select id="status-select">
            <option value="">Select Status</option>
            <option value="Currently Airing">Currently Airing</option>
            <option value="Finished Airing">Finished Airing</option>
            <option value="Not yet aired">Not yet aired</option>
        </select>
    </div>

    <!-- Clear Filters Button -->
    <button class="clear-filters-button" onclick="clearFilters()">Clear Filters</button>
</div>

<script>
    // Function to clear all filters (dropdown selections)
    function clearFilters() {
        const selects = document.querySelectorAll('.filter-dropdown select');
        selects.forEach(select => {
            select.selectedIndex = 0;  // Reset to first option (placeholder)
        });
    }
</script>

</body>
</html>
