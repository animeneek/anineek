        { value: "thriller", text: "Thriller" },
        { value: "seinen", text: "Seinen" },
        { value: "josei", text: "Josei" }
    ];

    // Function to populate the first dropdown with genres
    function populateGenres() {
        const filter1 = document.getElementById("filter1");
        genres.forEach(genre => {
            const option = document.createElement("option");
            option.value = genre.value;
            option.text = genre.text;
            filter1.add(option);
        });
    }

    // Call the function to populate genres when the page loads
    document.addEventListener("DOMContentLoaded", populateGenres);
</script>
