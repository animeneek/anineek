<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Filter Menu</title>
    <style>
        /* Filter Menu Styling */

        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 80px; /* Adjust this value if needed */
            z-index: 999; /* Ensure it stays on top */
        }

        .filter-dropdown {
            position: relative;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px;
            max-width: 200px;
            cursor: pointer;
        }

        .filter-dropdown-content {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #333;
            color: white;
            width: 100%;
            padding: 5px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 999;
            display: none;
        }

        .filter-dropdown-content label {
            display: block;
            padding: 5px;
            cursor: pointer;
        }

        .filter-dropdown-content label:hover {
            background-color: #444;
        }

        .clear-filters-button {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 5px;
        }

        .clear-filters-button:hover {
            background: #ff2222;
        }
    </style>
</head>
<body>

<div class="filter-menu">
    <!-- Genres -->
    <div class="filter-dropdown" id="genres">
        <div class="filter-dropdown-content" id="genres-dropdown">
            <label><input type="checkbox" value="Action"> Action</label>
            <label><input type="checkbox" value="Adventure"> Adventure</label>
            <label><input type="checkbox" value="Comedy"> Comedy</label>
            <label><input type="checkbox" value="Drama"> Drama</label>
            <label><input type="checkbox" value="Fantasy"> Fantasy</label>
            <label><input type="checkbox" value="Horror"> Horror</label>
            <label><input type="checkbox" value="Romance"> Romance</label>
        </div>
    </div>

    <!-- Themes -->
    <div class="filter-dropdown" id="themes">
        <div class="filter-dropdown-content" id="themes-dropdown">
            <label><input type="checkbox" value="Anthropomorphic"> Anthropomorphic</label>
            <label><input type="checkbox" value="Combat Sports"> Combat Sports</label>
            <label><input type="checkbox" value="Detective"> Detective</label>
            <label><input type="checkbox" value="Gore"> Gore</label>
            <label><input type="checkbox" value="Harem"> Harem</label>
            <label><input type="checkbox" value="Isekai"> Isekai</label>
            <label><input type="checkbox" value="Psychological"> Psychological</label>
        </div>
    </div>

    <!-- Demographics -->
    <div class="filter-dropdown" id="demographics">
        <div class="filter-dropdown-content" id="demographics-dropdown">
            <label><input type="checkbox" value="Shounen"> Shounen</label>
            <label><input type="checkbox" value="Shoujo"> Shoujo</label>
            <label><input type="checkbox" value="Seinen"> Seinen</label>
            <label><input type="checkbox" value="Josei"> Josei</label>
            <label><input type="checkbox" value="Kodomo"> Kodomo</label>
        </div>
    </div>

    <!-- Anime Seasons -->
    <div class="filter-dropdown" id="seasons">
        <div class="filter-dropdown-content" id="seasons-dropdown">
            <label><input type="checkbox" value="Winter"> Winter</label>
            <label><input type="checkbox" value="Spring"> Spring</label>
            <label><input type="checkbox" value="Summer"> Summer</label>
            <label><input type="checkbox" value="Fall"> Fall</label>
        </div>
    </div>

    <!-- Type -->
    <div class="filter-dropdown" id="types">
        <div class="filter-dropdown-content" id="types-dropdown">
            <label><input type="checkbox" value="TV"> TV</label>
            <label><input type="checkbox" value="OVA"> OVA</label>
            <label><input type="checkbox" value="ONA"> ONA</label>
            <label><input type="checkbox" value="Movie"> Movie</label>
            <label><input type="checkbox" value="Special"> Special</label>
            <label><input type="checkbox" value="Music"> Music</label>
        </div>
    </div>

    <!-- Status -->
    <div class="filter-dropdown" id="status">
        <div class="filter-dropdown-content" id="status-dropdown">
            <label><input type="checkbox" value="Currently Airing"> Currently Airing</label>
            <label><input type="checkbox" value="Finished Airing"> Finished Airing</label>
            <label><input type="checkbox" value="Not yet aired"> Not yet aired</label>
        </div>
    </div>

    <!-- Clear Filters Button -->
    <button class="clear-filters-button" onclick="clearFilters()">Clear Filters</button>
</div>

<script>
    // Function to toggle the dropdown content visibility
    const filterDropdowns = document.querySelectorAll('.filter-dropdown');
    filterDropdowns.forEach(dropdown => {
        dropdown.addEventListener('click', function(event) {
            const content = dropdown.querySelector('.filter-dropdown-content');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
            event.stopPropagation(); // Prevent event propagation to body
        });
    });

    // Function to clear all filters (checkbox selections)
    function clearFilters() {
        const checkboxes = document.querySelectorAll('.filter-dropdown-content input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            checkbox.checked = false;
        });
    }

    // Close dropdowns if clicked outside
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.filter-dropdown')) {
            document.querySelectorAll('.filter-dropdown-content').forEach(content => {
                content.style.display = 'none';
            });
        }
    });
</script>

</body>
</html>
