<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Search Results - AniNeek</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/8e3f3e5f4e.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Include Header -->
    <div id="header"></div>

    <!-- Search Results Container -->
    <div id="searchResultsContainer" class="search-results-container">
        <div id="searchResults" class="search-results"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            fetch("header.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("header").innerHTML = data;
                    // Initialize search and random functionality after loading the header
                    initializeSearchAndRandom();
                });

            // Fetch and display search results based on query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const selectedGenres = urlParams.get('genres');
            if (selectedGenres) {
                searchAnime(selectedGenres.split(','));
            }
        });

        async function searchAnime(genres) {
            const query = ''; // Replace with actual search query if needed
            const url = `https://api.jikan.moe/v4/anime?q=${query}&genres=${genres.join(',')}&limit=25&page=1`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                displaySearchResults(data);
            } catch (error) {
                console.error("Error fetching anime:", error);
            }
        }

        function displaySearchResults(data) {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = ''; // Clear previous results

            data.data.forEach(anime => {
                const animeItem = document.createElement('div');
                animeItem.className = 'anime-item';

                animeItem.innerHTML = `
                    <div class="poster-container">
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}" class="anime-poster">
                        <div class="overlay">
                            <div class="play-button"><i class="fas fa-play"></i></div>
                        </div>
                    </div>
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-details">
                        <div class="detail-box">${anime.type}</div>
                        <div class="detail-box">${anime.episodes} Episodes</div>
                        <div class="detail-box">${anime.score} Rating</div>
                        <div class="detail-box">${anime.start_date ? new Date(anime.start_date).getFullYear() : 'N/A'}</div>
                    </div>
                `;

                searchResults.appendChild(animeItem);
            });
        }
    </script>

</body>
</html>
