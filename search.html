<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>AniNeek - Search Results</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/8e3f3e5f4e.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Include Header -->
    <div id="header"></div>

    <!-- Include Filter Menu -->
    <div id="filter-menu-container"></div>

    <main>
        <h1 id="searchTitle">Search Results</h1>
        <div id="animeResults" class="grid-container">Loading...</div>
        <div id="pagination"></div>
    </main>

    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
                // Initialize search and random functionality after loading the header
                initializeSearchAndRandom();
            });

        // Load the filter menu HTML and inject it into the container
        fetch('filter-menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('filter-menu-container').innerHTML = html;
                // After loading the filter menu, fetch genres
                fetchGenres();
            })
            .catch(error => console.error('Error loading filter menu:', error));

        async function fetchGenres() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/genres/anime');
                const data = await response.json();
                const genres = data.data.sort((a, b) => a.name.localeCompare(b.name));
                const genreDropdown = document.getElementById('genreDropdown');

                genres.forEach(genre => {
                    const option = document.createElement('option');
                    option.value = genre.mal_id;
                    option.textContent = genre.name;
                    genreDropdown.appendChild(option);
                });

                // Check the genres in the URL and select them in the dropdown
                const urlParams = new URLSearchParams(window.location.search);
                const selectedGenres = urlParams.get('genres') ? urlParams.get('genres').split(',') : [];
                selectedGenres.forEach(genreId => {
                    const option = genreDropdown.querySelector(`option[value="${genreId}"]`);
                    if (option) {
                        option.selected = true;
                    }
                });
            } catch (error) {
                console.error("Error fetching genres:", error);
            }
        }

        // Fetch query parameters from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || ''; // Get search query (e.g. "dragon")
        const selectedGenres = urlParams.get('genres') ? urlParams.get('genres').split(',') : []; // Get selected genres
        const currentPage = urlParams.get('page') || 1; // Default to page 1 if not provided

        // Search for anime with filters applied
        if (selectedGenres.length > 0 || query) {
            searchAnime(query, selectedGenres, currentPage);
        }

        async function searchAnime(query, genres, page) {
            const url = `https://api.jikan.moe/v4/anime?q=${query}&genres=${genres.join(',')}&page=${page}&limit=25`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                displaySearchResults(data);
                setupPagination(data.meta.pagination, query, genres);
            } catch (error) {
                console.error("Error fetching anime:", error);
            }
        }

        function displaySearchResults(data) {
            const animeResults = document.getElementById('animeResults');
            animeResults.innerHTML = ''; // Clear previous results

            if (data.data.length === 0) {
                animeResults.innerHTML = '<p>No results found for the selected filters.</p>';
                return;
            }

            data.data.forEach(anime => {
                const animeItem = document.createElement('div');
                animeItem.className = 'anime-item';
                animeItem.innerHTML = `
                    <div class="poster-container">
                        <a href="info.html?id=${anime.mal_id}">
                            <img src="${anime.images.jpg.image_url}" alt="${anime.title}" class="anime-poster">
                            <div class="overlay">
                                <div class="play-button"><i class="fas fa-play"></i></div>
                            </div>
                        </a>
                    </div>
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-details">
                        <div class="detail-box">${anime.type}</div>
                        <div class="detail-box">${anime.episodes} Episodes</div>
                        <div class="detail-box">${anime.score} Rating</div>
                        <div class="detail-box">${anime.start_date ? new Date(anime.start_date).getFullYear() : 'N/A'}</div>
                    </div>
                `;
                animeResults.appendChild(animeItem);
            });
        }

        function setupPagination(paginationData, query, genres) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = ''; // Clear existing pagination

            // Calculate total pages based on the number of results
            const totalPages = paginationData.last_page;

            // Only show pagination if there are multiple pages
            if (totalPages > 1) {
                const currentPage = paginationData.current_page;

                // Previous page button
                const prevPageButton = document.createElement('button');
                prevPageButton.textContent = 'Prev';
                prevPageButton.disabled = currentPage === 1;
                prevPageButton.onclick = () => navigateToPage(currentPage - 1, query, genres);
                pagination.appendChild(prevPageButton);

                // Next page button
                const nextPageButton = document.createElement('button');
                nextPageButton.textContent = 'Next';
                nextPageButton.disabled = currentPage === totalPages;
                nextPageButton.onclick = () => navigateToPage(currentPage + 1, query, genres);
                pagination.appendChild(nextPageButton);
            }
        }

        // Handle navigation between pages
        function navigateToPage(page, query, genres) {
            const url = `search.html?q=${query}&genres=${genres.join(',')}&page=${page}`;
            window.location.href = url;
        }
    </script>

    <script src="search.js"></script>
    <script src="index.js"></script>
    <script src="anilist-image-replacer.js"></script>

</body>
</html>
