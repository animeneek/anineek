<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>AniNeek - Search Results</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/8e3f3e5f4e.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Include Header -->
    <div id="header"></div>

    <!-- Include Filter Menu -->
    <div id="filter-menu-container"></div>

    <main>
        <h1 id="searchTitle">Search Results</h1>
        <div id="animeResults" class="grid-container">Loading...</div>
        <div id="pagination"></div>
    </main>

    <script>
        // Load the header HTML
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
                initializeSearchAndRandom();
            });

        // Load the filter menu HTML and inject it into the container
        fetch('filter-menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('filter-menu-container').innerHTML = html;
                // After loading the filter menu, initialize the dropdown and fetch genres
                initializeDropdown();
                fetchGenres();
            })
            .catch(error => console.error('Error loading filter menu:', error));

        // Initialize the dropdown functionality in filter-menu
        function initializeDropdown() {
            const dropdownButton = document.querySelector('.filter-menu .dropdown button');
            dropdownButton.addEventListener('click', function() {
                const dropdownContent = document.querySelector('.filter-menu .dropdown-content');
                dropdownContent.classList.toggle('open');
            });
        }

        // Fetch genres and populate dropdown
        async function fetchGenres() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/genres/anime');
                const data = await response.json();
                const genres = data.data.sort((a, b) => a.name.localeCompare(b.name));
                const genreDropdown = document.getElementById('genreDropdown');

                genres.forEach(genre => {
                    const label = document.createElement('label');
                    label.className = 'genre-label';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = genre.mal_id;
                    checkbox.id = `genre-${genre.mal_id}`;
                    checkbox.className = 'genre-checkbox';

                    const span = document.createElement('span');
                    span.textContent = genre.name;

                    label.appendChild(checkbox);
                    label.appendChild(span);
                    genreDropdown.appendChild(label);
                });

                // Check the genres in the URL and select them in the dropdown
                const urlParams = new URLSearchParams(window.location.search);
                const selectedGenres = urlParams.get('genres') ? urlParams.get('genres').split(',') : [];
                selectedGenres.forEach(genreId => {
                    const option = genreDropdown.querySelector(`input[value="${genreId}"]`);
                    if (option) {
                        option.checked = true;
                    }
                });
            } catch (error) {
                console.error("Error fetching genres:", error);
            }
        }

        // Apply selected filters
        function applyFilters() {
            const selectedGenres = Array.from(document.querySelectorAll('.genre-checkbox:checked')).map(checkbox => checkbox.value);
            const searchParams = new URLSearchParams(window.location.search);
            const query = searchParams.get('q') || '';
            if (selectedGenres.length > 0) {
                // Ensure the genres are included in the URL
                const url = `search.html?q=${query}&genres=${selectedGenres.join(',')}`;
                window.location.href = url;
            }
        }

        // Fetch and display search results based on query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';
        const selectedGenres = urlParams.get('genres') ? urlParams.get('genres').split(',') : [];
        if (selectedGenres.length > 0 || query) {
            searchAnime(query, selectedGenres);
        }

        async function searchAnime(query, genres) {
            const url = `https://api.jikan.moe/v4/anime?q=${query}&genres=${genres.join(',')}&limit=25&page=1`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                displaySearchResults(data);
            } catch (error) {
                console.error("Error fetching anime:", error);
            }
        }

        function displaySearchResults(data) {
            const animeResults = document.getElementById('animeResults');
            animeResults.innerHTML = ''; // Clear previous results

            data.data.forEach(anime => {
                const animeItem = document.createElement('div');
                animeItem.className = 'anime-item';

                animeItem.innerHTML = `
                    <div class="poster-container">
                        <a href="info.html?id=${anime.mal_id}">
                            <img src="${anime.images.jpg.image_url}" alt="${anime.title}" class="anime-poster">
                            <div class="overlay">
                                <div class="play-button"><i class="fas fa-play"></i></div>
                            </div>
                        </a>
                    </div>
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-details">
                        <div class="detail-box">${anime.type}</div>
                        <div class="detail-box">${anime.episodes} Episodes</div>
                        <div class="detail-box">${anime.score} Rating</div>
                        <div class="detail-box">${anime.start_date ? new Date(anime.start_date).getFullYear() : 'N/A'}</div>
                    </div>
                `;

                animeResults.appendChild(animeItem);
            });
        }
    </script>

    <script src="search.js"></script>
    <script src="index.js"></script>
    <script src="anilist-image-replacer.js"></script>

</body>
</html>
